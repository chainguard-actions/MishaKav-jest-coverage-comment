name: Test title input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          title: 'My Custom Coverage Title'
          coverage-summary-path: ${{ github.workspace }}/hardened/tests/fixtures/coverage-summary-85.json
          hide-comment: 'true'

      - name: Assert title input accepted and outputs produced
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi

          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi

          if [ -z "$COLOR" ]; then
            echo "FAIL: color output is empty"
            exit 1
          fi

          echo "PASS: title input accepted, coverage=$COVERAGE, color=$COLOR"
