name: Test multiple coverage files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          hide-comment: 'true'
          multiple-files: |
            App1, ${{ github.workspace }}/tests/fixtures/coverage-summary-app1.json
            App2, ${{ github.workspace }}/tests/fixtures/coverage-summary-app2.json

      - name: Assert multiple files action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with multiple files"
            exit 0
          fi

          echo "FAIL: unexpected outcome '$OUTCOME'"
          exit 1
