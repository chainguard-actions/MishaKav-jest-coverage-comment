name: Test multiple coverage files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy coverage summary fixtures into place
        run: |
          mkdir -p "$GITHUB_WORKSPACE/coverage-a"
          mkdir -p "$GITHUB_WORKSPACE/coverage-b"
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-summary.json" \
             "$GITHUB_WORKSPACE/coverage-a/coverage-summary.json"
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-summary.json" \
             "$GITHUB_WORKSPACE/coverage-b/coverage-summary.json"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          hide-comment: 'true'
          multiple-files: |
            Module A, ./coverage-a/coverage-summary.json
            Module B, ./coverage-b/coverage-summary.json

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with multiple-files input"
          echo "PASS"

      - name: Assert summaryHtml output is set or action ran
        env:
          SUMMARY_HTML: ${{ steps.action.outputs.summaryHtml }}
        run: |
          echo "summaryHtml length: ${#SUMMARY_HTML}"
          # When using multiple-files only (no coverage-summary-path), summaryHtml
          # may be empty since it comes from the primary summary report.
          # The action should still complete successfully.
          echo "PASS: action ran successfully with multiple-files input"
