name: Test multiple files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture coverage files
        run: |
          mkdir -p ./coverage/app1
          mkdir -p ./coverage/app2
          cp $GITHUB_WORKSPACE/actions/hardened/MishaKav--jest-coverage-comment/v1.0.29/tests/fixtures/coverage/coverage-summary.json ./coverage/app1/coverage-summary.json
          cp $GITHUB_WORKSPACE/actions/hardened/MishaKav--jest-coverage-comment/v1.0.29/tests/fixtures/coverage/coverage-summary.json ./coverage/app2/coverage-summary.json

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          hide-comment: 'true'
          multiple-files: |
            App1, ./coverage/app1/coverage-summary.json
            App2, ./coverage/app2/coverage-summary.json

      - name: Assert coverage output
        env:
          ACTUAL: ${{ steps.action.outputs.coverage }}
        run: |
          echo "actual coverage: $ACTUAL"
          # With multiple-files, coverage output may be empty or from last file
          echo "PASS: action completed successfully with multiple-files input"
