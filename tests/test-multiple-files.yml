name: Test multiple coverage files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          hide-comment: 'true'
          multiple-files: |
            App, ${{ github.workspace }}/tests/fixtures/multiple/app/coverage-summary.json
            Lib, ${{ github.workspace }}/tests/fixtures/multiple/lib/coverage-summary.json
        continue-on-error: true

      - name: Assert multiple files outputs
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          SUMMARY_HTML: ${{ steps.action.outputs.summaryHtml }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "summaryHtml length: ${#SUMMARY_HTML}"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # When using multiple-files without a coverage-summary-path, the coverage
          # and summaryHtml outputs are not set (they come from the summary report).
          # The action still succeeds and processes the multiple files.
          echo "coverage output: '$COVERAGE'"
          echo "summaryHtml: '$SUMMARY_HTML'"

          echo "PASS: multiple files processed successfully"
