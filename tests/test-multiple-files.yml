name: Test multiple coverage files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple coverage summary files
        run: |
          mkdir -p coverage/app coverage/lib

          cat > coverage/app/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 75, "skipped": 0, "pct": 75 },
              "statements": { "total": 110, "covered": 82, "skipped": 0, "pct": 74.54 },
              "functions": { "total": 25, "covered": 20, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 28, "skipped": 0, "pct": 70 }
            }
          }
          EOF

          cat > coverage/lib/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 200, "covered": 190, "skipped": 0, "pct": 95 },
              "statements": { "total": 220, "covered": 209, "skipped": 0, "pct": 95 },
              "functions": { "total": 50, "covered": 48, "skipped": 0, "pct": 96 },
              "branches": { "total": 80, "covered": 76, "skipped": 0, "pct": 95 }
            }
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          hide-comment: 'true'
          multiple-files: |
            App, ./coverage/app/coverage-summary.json
            Lib, ./coverage/lib/coverage-summary.json
        continue-on-error: true

      - name: Assert multiple files outputs
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
          SUMMARY_HTML: ${{ steps.action.outputs.summaryHtml }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"
          echo "summaryHtml length: ${#SUMMARY_HTML}"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for PR comment)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with multiple files"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
