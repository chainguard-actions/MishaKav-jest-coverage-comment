name: Test junitxml outputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify fixture files exist
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ./tests/fixtures/coverage-summary.json
          junitxml-path: ./tests/fixtures/junit.xml
          junitxml-title: 'Test Results'
          hide-comment: 'true'

      - name: Assert junitxml outputs
        env:
          TESTS: ${{ steps.action.outputs.tests }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          FAILURES: ${{ steps.action.outputs.failures }}
          ERRORS: ${{ steps.action.outputs.errors }}
          TIME: ${{ steps.action.outputs.time }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tests: $TESTS"
          echo "skipped: $SKIPPED"
          echo "failures: $FAILURES"
          echo "errors: $ERRORS"
          echo "time: $TIME"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (runtime or environment issue)"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # junit.xml has tests="6"
          if [ -z "$TESTS" ]; then
            echo "FAIL: tests output is empty"
            exit 1
          fi
          if [ "$TESTS" != "6" ]; then
            echo "FAIL: expected tests=6, got '$TESTS'"
            exit 1
          fi
          echo "PASS: tests='$TESTS'"

          # junit.xml has failures="0"
          if [ "$FAILURES" != "0" ]; then
            echo "FAIL: expected failures=0, got '$FAILURES'"
            exit 1
          fi
          echo "PASS: failures='$FAILURES'"

          # junit.xml has errors="0"
          if [ "$ERRORS" != "0" ]; then
            echo "FAIL: expected errors=0, got '$ERRORS'"
            exit 1
          fi
          echo "PASS: errors='$ERRORS'"

          # junit.xml has time="0.732"
          if [ -z "$TIME" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          echo "PASS: time='$TIME'"
