name: Test basic coverage output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ${{ github.workspace }}/actions/hardened/MishaKav--jest-coverage-comment/v1.0.30/tests/fixtures/coverage/coverage-summary.json
          hide-comment: 'true'
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main

      - name: Assert coverage output
        env:
          ACTUAL: ${{ steps.action.outputs.coverage }}
        run: |
          echo "actual coverage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "80" ]; then
            echo "FAIL: expected coverage '80', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert color output
        env:
          ACTUAL: ${{ steps.action.outputs.color }}
        run: |
          echo "actual color: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: color output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert summaryHtml output
        env:
          ACTUAL: ${{ steps.action.outputs.summaryHtml }}
        run: |
          echo "actual summaryHtml length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: summaryHtml output is empty"
            exit 1
          fi
          echo "PASS"
