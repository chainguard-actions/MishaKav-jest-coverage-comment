name: Test basic coverage summary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage-summary.json
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 120, "covered": 96, "skipped": 0, "pct": 80 },
              "functions": { "total": 30, "covered": 24, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ./coverage/coverage-summary.json
          hide-comment: 'true'

      - name: Assert coverage output
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "coverage: $COVERAGE"
          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          echo "PASS: coverage output is '$COVERAGE'"

      - name: Assert color output
        env:
          COLOR: ${{ steps.action.outputs.color }}
        run: |
          echo "color: $COLOR"
          if [ -z "$COLOR" ]; then
            echo "FAIL: color output is empty"
            exit 1
          fi
          echo "PASS: color output is '$COLOR'"

      - name: Assert summaryHtml output
        env:
          SUMMARY_HTML: ${{ steps.action.outputs.summaryHtml }}
        run: |
          echo "summaryHtml length: ${#SUMMARY_HTML}"
          if [ -z "$SUMMARY_HTML" ]; then
            echo "FAIL: summaryHtml output is empty"
            exit 1
          fi
          echo "PASS: summaryHtml is non-empty"
