name: Test coverage text report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ${{ github.workspace }}/tests/fixtures/coverage-85/coverage-summary.json
          coverage-path: ${{ github.workspace }}/tests/fixtures/coverage-85/coverage.txt
          coverage-title: 'Full Coverage Report'
          hide-comment: 'true'
        continue-on-error: true

      - name: Assert text report outputs
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          LINES: ${{ steps.action.outputs.lines }}
          BRANCHES: ${{ steps.action.outputs.branches }}
          FUNCTIONS: ${{ steps.action.outputs.functions }}
          STATEMENTS: ${{ steps.action.outputs.statements }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "lines: $LINES"
          echo "branches: $BRANCHES"
          echo "functions: $FUNCTIONS"
          echo "statements: $STATEMENTS"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          if [ -z "$COVERAGE" ]; then
            echo "FAIL: expected coverage output to be set"
            exit 1
          fi

          if [ "$COVERAGE" != "85" ]; then
            echo "FAIL: expected coverage to be 85, got '$COVERAGE'"
            exit 1
          fi

          # Lines/branches/functions/statements come from the text report
          if [ -n "$LINES" ]; then
            echo "lines output: $LINES"
            if [ "$LINES" != "85" ]; then
              echo "FAIL: expected lines to be 85, got '$LINES'"
              exit 1
            fi
          else
            echo "INFO: lines output not set (may require specific text format)"
          fi

          echo "PASS: coverage=$COVERAGE"
