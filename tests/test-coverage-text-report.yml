name: Test Coverage Text Report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage text report and summary files
        run: |
          mkdir -p coverage

          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 75, "skipped": 0, "pct": 75 },
              "statements": { "total": 120, "covered": 90, "skipped": 0, "pct": 75 },
              "functions": { "total": 30, "covered": 22, "skipped": 0, "pct": 73.33 },
              "branches": { "total": 40, "covered": 28, "skipped": 0, "pct": 70 }
            }
          }
          EOF

          cat > coverage/coverage.txt << 'EOF'
          ----------------------|---------|----------|---------|---------|-------------------
          File                  | % Stmts | % Branch | % Funcs | % Lines | Uncovered Line #s
          ----------------------|---------|----------|---------|---------|-------------------
          All files             |      75 |       70 |   73.33 |      75 |
           src                  |      75 |       70 |   73.33 |      75 |
            index.js            |      75 |       70 |   73.33 |      75 | 10-15,20
          ----------------------|---------|----------|---------|---------|-------------------
          EOF

      - id: coverage
        uses: .
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ./coverage/coverage-summary.json
          coverage-path: ./coverage/coverage.txt
          coverage-title: 'My Coverage Report'
          hide-comment: 'true'

      - name: Assert text report outputs
        env:
          LINES: ${{ steps.coverage.outputs.lines }}
          BRANCHES: ${{ steps.coverage.outputs.branches }}
          FUNCTIONS: ${{ steps.coverage.outputs.functions }}
          STATEMENTS: ${{ steps.coverage.outputs.statements }}
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
        run: |
          echo "lines: $LINES"
          echo "branches: $BRANCHES"
          echo "functions: $FUNCTIONS"
          echo "statements: $STATEMENTS"
          echo "coverage: $COVERAGE"

          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          echo "PASS: coverage output is '$COVERAGE'"

          if [ -z "$LINES" ] && [ -z "$BRANCHES" ] && [ -z "$FUNCTIONS" ] && [ -z "$STATEMENTS" ]; then
            echo "INFO: text report outputs are empty (may require specific format) - checking coverage output only"
          else
            echo "PASS: text report outputs present"
          fi
          echo "PASS: action completed successfully"
