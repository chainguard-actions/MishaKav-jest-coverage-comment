name: Test high coverage color output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ${{ github.workspace }}/tests/fixtures/coverage-summary-95.json
          hide-comment: 'true'
          badge-title: 'Test Coverage'

      - name: Assert high coverage outputs
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi

          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi

          if [ "$COVERAGE" != "95" ]; then
            echo "FAIL: expected coverage=95, got '$COVERAGE'"
            exit 1
          fi

          if [ -z "$COLOR" ]; then
            echo "FAIL: color output is empty"
            exit 1
          fi

          # High coverage (>=90%) should produce a brightgreen color
          if [ "$COLOR" != "brightgreen" ] && [ "$COLOR" != "green" ]; then
            echo "WARN: expected green color for 95% coverage, got '$COLOR'"
          fi

          echo "PASS: coverage=$COVERAGE, color=$COLOR"
