name: Test high coverage percentage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ${{ github.workspace }}/tests/fixtures/coverage-95/coverage-summary.json
          hide-comment: 'true'
          badge-title: 'Test Coverage'
          summary-title: 'Coverage Summary'
        continue-on-error: true

      - name: Assert high coverage outputs
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          if [ -z "$COVERAGE" ]; then
            echo "FAIL: expected coverage output to be set"
            exit 1
          fi

          if [ "$COVERAGE" != "95" ]; then
            echo "FAIL: expected coverage to be 95, got '$COVERAGE'"
            exit 1
          fi

          if [ -z "$COLOR" ]; then
            echo "FAIL: expected color output to be set"
            exit 1
          fi

          # High coverage (>=90) should produce a brightgreen color
          echo "color value: $COLOR"
          if [ "$COLOR" != "brightgreen" ] && [ "$COLOR" != "green" ]; then
            echo "WARN: expected green color for 95% coverage, got '$COLOR' (may vary by implementation)"
          fi

          echo "PASS: coverage=$COVERAGE color=$COLOR"
