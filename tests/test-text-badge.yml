name: Test text instead of badge
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture coverage file
        run: |
          mkdir -p ./coverage
          cp $GITHUB_WORKSPACE/actions/hardened/MishaKav--jest-coverage-comment/v1.0.29/tests/fixtures/coverage/coverage-summary.json ./coverage/coverage-summary.json

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: './coverage/coverage-summary.json'
          hide-comment: 'true'
          text-instead-badge: 'true'
          remove-links-to-files: 'true'
          remove-links-to-lines: 'true'
          coverage-path-prefix: 'src/'
          create-new-comment: 'false'
          unique-id-for-comment: 'test-matrix-1'

      - name: Assert coverage output
        env:
          ACTUAL: ${{ steps.action.outputs.coverage }}
        run: |
          echo "actual coverage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "80" ]; then
            echo "FAIL: expected coverage '80', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: coverage=$ACTUAL"

      - name: Assert summaryHtml output
        env:
          ACTUAL: ${{ steps.action.outputs.summaryHtml }}
        run: |
          echo "actual summaryHtml length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: summaryHtml output is empty"
            exit 1
          fi
          echo "PASS: summaryHtml is non-empty"
