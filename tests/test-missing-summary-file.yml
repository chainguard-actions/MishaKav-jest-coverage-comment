name: Test missing coverage summary file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          coverage-summary-path: ./tests/fixtures/does-not-exist.json
      - name: Assert action succeeded with no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COVERAGE: ${{ steps.action.outputs.coverage }}
          SUMMARY: ${{ steps.action.outputs.summaryHtml }}
        run: |
          echo "outcome=$OUTCOME coverage='$COVERAGE' summary='$SUMMARY'"
          [ "$OUTCOME" = "success" ] || { echo "FAIL: expected success"; exit 1; }
          if [ -n "$COVERAGE" ] || [ -n "$SUMMARY" ]; then
            echo "FAIL: expected no outputs for missing file"
            exit 1
          fi
          echo "PASS"
