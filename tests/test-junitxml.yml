name: Test junitxml report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ${{ github.workspace }}/tests/fixtures/coverage-75/coverage-summary.json
          junitxml-path: ${{ github.workspace }}/tests/fixtures/coverage-75/junit.xml
          junitxml-title: 'Test Results'
          hide-comment: 'true'
        continue-on-error: true

      - name: Assert junitxml outputs
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          TESTS: ${{ steps.action.outputs.tests }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          FAILURES: ${{ steps.action.outputs.failures }}
          ERRORS: ${{ steps.action.outputs.errors }}
          TIME: ${{ steps.action.outputs.time }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "tests: $TESTS"
          echo "skipped: $SKIPPED"
          echo "failures: $FAILURES"
          echo "errors: $ERRORS"
          echo "time: $TIME"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          if [ -z "$COVERAGE" ]; then
            echo "FAIL: expected coverage output to be set"
            exit 1
          fi

          if [ "$COVERAGE" != "75" ]; then
            echo "FAIL: expected coverage to be 75, got '$COVERAGE'"
            exit 1
          fi

          if [ -z "$TESTS" ]; then
            echo "FAIL: expected tests output to be set from junitxml"
            exit 1
          fi

          if [ "$TESTS" != "42" ]; then
            echo "FAIL: expected tests to be 42, got '$TESTS'"
            exit 1
          fi

          if [ "$FAILURES" != "2" ]; then
            echo "FAIL: expected failures to be 2, got '$FAILURES'"
            exit 1
          fi

          if [ "$ERRORS" != "1" ]; then
            echo "FAIL: expected errors to be 1, got '$ERRORS'"
            exit 1
          fi

          echo "PASS: coverage=$COVERAGE tests=$TESTS failures=$FAILURES errors=$ERRORS"
