name: Test basic coverage summary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage-summary.json
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 120, "covered": 96, "skipped": 0, "pct": 80 },
              "functions": { "total": 30, "covered": 24, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 28, "skipped": 0, "pct": 70 }
            },
            "src/index.js": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 120, "covered": 96, "skipped": 0, "pct": 80 },
              "functions": { "total": 30, "covered": 24, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 28, "skipped": 0, "pct": 70 }
            }
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          coverage-summary-path: ./coverage/coverage-summary.json
          hide-comment: 'true'
        continue-on-error: true

      - name: Assert coverage output
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
          SUMMARY_HTML: ${{ steps.action.outputs.summaryHtml }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"
          echo "summaryHtml length: ${#SUMMARY_HTML}"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi

          if [ -z "$COVERAGE" ]; then
            echo "FAIL: expected coverage output to be set"
            exit 1
          fi

          if [ "$COVERAGE" != "80" ]; then
            echo "FAIL: expected coverage to be 80, got '$COVERAGE'"
            exit 1
          fi

          if [ -z "$COLOR" ]; then
            echo "FAIL: expected color output to be set"
            exit 1
          fi

          echo "PASS: coverage=$COVERAGE color=$COLOR"
